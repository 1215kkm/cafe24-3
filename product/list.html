<!--@layout(/layout/basic/layout.html)-->
<!--@css(/layout/basic/css/product.css)-->

<div class="product-list-page">
    <!-- Category Header -->
    <div class="category-header" module="product_headcategory">
        <div class="inner">
            <h1>{$title_text_or_image}</h1>
            <p>트렌디한 스타일을 만나보세요</p>
        </div>
    </div>

    <div class="inner">
        <!-- Breadcrumb -->
        <div class="breadcrumb" module="product_headcategory">
            <ol>
                <li><a href="/">Home</a></li>
                <li class="{$disp_cate_1|display}"><a href="{$link_product_list_1}">{$name_1}</a></li>
                <li class="{$disp_cate_2|display}"><a href="{$link_product_list_2}">{$name_2}</a></li>
                <li class="{$disp_cate_3|display}"><a href="{$link_product_list_3}">{$name_3}</a></li>
                <li class="{$disp_cate_4|display}"><a href="{$link_product_list_4}">{$name_4}</a></li>
            </ol>
        </div>

        <!-- Product List -->
        <div module="product_list">
            <!--@css(/css/module/product/listnormal.css)-->
            <!--
                $count = 20
                $basket_result = /product/add_basket.html
                $basket_option = /product/basket_option.html
            -->

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="result-count">
                    Total <strong>{$total_count}</strong> items
                </div>
                <div class="filter-options">
                    <select class="filter-select" onchange="location.href=this.value">
                        <option value="?sort=order" {$sort_order}>신상품순</option>
                        <option value="?sort=popular" {$sort_popular}>인기순</option>
                        <option value="?sort=price_asc" {$sort_price_asc}>낮은가격순</option>
                        <option value="?sort=price_desc" {$sort_price_desc}>높은가격순</option>
                        <option value="?sort=review" {$sort_review}>리뷰많은순</option>
                    </select>
                </div>
            </div>

            <!-- Product Grid -->
            <div class="product-grid grid-4">
                <div class="product-card" id="anchorBoxId_{$product_no}">
                    <div class="thumbnail">
                        <a href="{$link_product_detail}" name="anchorBoxName_{$product_no}">
                            <img src="{$image_medium}" alt="{$seo_alt_tag}">
                        </a>
                        <div class="badges">
                            <span class="badge badge-new {$new_icon|display}">New</span>
                            <span class="badge badge-sale {$discount_rate|display}">{$discount_rate}%</span>
                            <span class="badge badge-soldout {$soldout_icon|display}">Sold Out</span>
                        </div>
                        <button class="wish-btn" type="button" onclick="{$action_wish}">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                            </svg>
                        </button>
                        <div class="actions">
                            <button type="button" onclick="{$action_basket}" title="장바구니">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="info">
                        <p class="name"><a href="{$link_product_detail}">{$product_name}</a></p>
                        <p class="price">
                            <span class="original {$product_price_ref_display|display}">{$product_price}</span>
                            <span class="sale">{$disp_product_price}</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Empty Result -->
            <div class="empty-result {$no_product_display|display}">
                <p>등록된 상품이 없습니다.</p>
            </div>

            <!-- Pagination -->
            <div class="pagination" module="product_Paging">
                <a href="{$first_page_url}" class="first">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8.354 1.646a.5.5 0 0 1 0 .708L2.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
                        <path fill-rule="evenodd" d="M12.354 1.646a.5.5 0 0 1 0 .708L6.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
                    </svg>
                </a>
                <a href="{$prev_page_url}" class="prev">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
                    </svg>
                </a>
                <span class="{$is_current_page|display} current"><a href="{$page_url}">{$page_num}</a></span>
                <a href="{$next_page_url}" class="next">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
                    </svg>
                </a>
                <a href="{$last_page_url}" class="last">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M3.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L9.293 8 3.646 2.354a.5.5 0 0 1 0-.708z"/>
                        <path fill-rule="evenodd" d="M7.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L13.293 8 7.646 2.354a.5.5 0 0 1 0-.708z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</div>
