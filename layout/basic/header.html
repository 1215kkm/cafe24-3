<!-- ========== Header ========== -->
<header id="header">
    <!-- Top Bar -->
    <div class="header-top">
        <div class="inner">
            <div class="left-menu">
                <span module="Layout_multishopList">
                    <a href="//{$shop_domain}/" class="{$selected_class}">{$locale_language}</a>
                </span>
            </div>
            <div class="right-menu">
                <span module="Layout_statelogoff">
                    <a href="/member/login.html">Login</a>
                </span>
                <span module="Layout_statelogoff">
                    <a href="/member/agreement.html">Join</a>
                </span>
                <span module="Layout_stateLogon">
                    <a href="/member/modify.html">My Info</a>
                </span>
                <span module="Layout_stateLogon">
                    <a href="{$action_logout}">Logout</a>
                </span>
                <a href="/myshop/order/list.html">Order</a>
                <a href="/myshop/index.html">Mypage</a>
                <a href="/board/inquire/list.html">CS Center</a>
            </div>
        </div>
    </div>

    <!-- Header Main -->
    <div class="header-main">
        <div class="inner">
            <!-- Logo -->
            <h1 class="logo" module="Layout_LogoTop">
                <a href="/">BLOOM</a>
            </h1>

            <!-- Main Navigation -->
            <nav module="Layout_category">
                <ul class="main-nav">
                    <li>
                        <a href="{$link_category}">{$name}</a>
                        <ul class="sub-menu" module="Layout_category_sub">
                            <li><a href="{$link_category}">{$name}</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>

            <!-- Header Icons -->
            <div class="header-icons">
                <!-- Search -->
                <button type="button" onclick="openSearch()" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                </button>

                <!-- Wishlist -->
                <a href="/myshop/wish_list.html" aria-label="Wishlist">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                    </svg>
                </a>

                <!-- Cart -->
                <a href="/order/basket.html" module="Layout_orderBasketcount" aria-label="Cart">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    <span class="cart-count {$basket_count_display|display}">{$basket_count}</span>
                </a>

                <!-- Mobile Menu Button -->
                <button type="button" class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </div>
</header>
