<!--@layout(/layout/basic/layout.html)-->
<!--@css(/layout/basic/css/board.css)-->

<div class="board-page">
    <!-- Page Header -->
    <div class="page-header">
        <div class="inner">
            <h1>1:1 문의</h1>
            <p>궁금하신 점을 남겨주세요</p>
        </div>
    </div>

    <div class="inner">
        <!-- Board Navigation -->
        <nav class="board-nav">
            <a href="/board/notice/list.html">공지사항</a>
            <a href="/board/faq/list.html">FAQ</a>
            <a href="/board/inquire/list.html" class="active">1:1 문의</a>
        </nav>

        <!-- Board List -->
        <div module="board_list">
            <!--@css(/css/module/board/listPackage.css)-->

            <!-- Write Button -->
            <div class="board-actions">
                <a href="/board/inquire/write.html" class="btn btn-dark">문의하기</a>
            </div>

            <!-- List Header -->
            <div class="board-list">
                <div class="board-list-header">
                    <span>번호</span>
                    <span>제목</span>
                    <span>작성자</span>
                    <span>작성일</span>
                    <span>상태</span>
                </div>

                <!-- List Item -->
                <div class="board-list-item">
                    <span class="no">{$no}</span>
                    <span class="title">
                        <span class="badge secret {$secret_icon|display}">비밀글</span>
                        <a href="{$link_board_view}">{$subject}</a>
                    </span>
                    <span class="writer">{$writer}</span>
                    <span class="date">{$write_date}</span>
                    <span class="status">
                        <span class="status-badge {$reply_display|display} answered">답변완료</span>
                        <span class="status-badge {$not_reply_display|display} waiting">답변대기</span>
                    </span>
                </div>
            </div>

            <!-- Empty Message -->
            <div class="empty-result {$no_article_display|display}">
                <p>등록된 문의가 없습니다.</p>
            </div>

            <!-- Pagination -->
            <div class="pagination" module="board_Paging">
                <a href="{$first_page_url}">«</a>
                <a href="{$prev_page_url}">‹</a>
                <span class="{$is_current_page|display} current">
                    <a href="{$page_url}">{$page_num}</a>
                </span>
                <a href="{$next_page_url}">›</a>
                <a href="{$last_page_url}">»</a>
            </div>

            <!-- Search -->
            <form class="board-search" action="" method="get">
                <select name="search_type">
                    <option value="subject">제목</option>
                    <option value="content">내용</option>
                    <option value="writer">작성자</option>
                </select>
                <input type="text" name="search" placeholder="검색어를 입력하세요">
                <button type="submit" class="btn">검색</button>
            </form>
        </div>
    </div>
</div>

<style>
/* Inquire Board Additional Styles */
.board-list-header {
    grid-template-columns: 80px 1fr 120px 100px 100px;
}

.board-list-item {
    grid-template-columns: 80px 1fr 120px 100px 100px;
}

.status-badge {
    display: inline-block;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 500;
    border-radius: 3px;
}

.status-badge.answered {
    background: var(--color-primary);
    color: #fff;
}

.status-badge.waiting {
    background: var(--color-bg-light);
    color: var(--color-text-light);
}

@media (max-width: 768px) {
    .board-list-item .status {
        text-align: left;
    }
}
</style>
